name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Enforce canonical toolchain
        run: |
          v=$(go env GOVERSION)
          echo "GOVERSION=$v"
          [ "$v" = "go1.27.1" ] || { echo "expected go1.27.1, got $v"; exit 1; }

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

      - name: CLI smoke
        run: |
          go run ./cmd/reposuite-relay version | grep -q "reposuite-relay 0.1.0-dev"
          go run ./cmd/reposuite-relay help | grep -q "Usage:"
          ! go run ./cmd/reposuite-relay bogus-command 2>/dev/null

      - name: CLI smoke (native session surface)
        run: |
          set -eu
          tmp=$(mktemp -d)
          go build -o "$tmp/reposuite-relay" ./cmd/reposuite-relay
          # A `codex` on PATH that is the deterministic fake app-server:
          # scripted JSON-RPC only, no model call, no network, no quota.
          printf '#!/bin/sh\nexec %s __fake-codex "$@"\n' "$tmp/reposuite-relay" > "$tmp/codex"
          chmod +x "$tmp/codex"
          export PATH="$tmp:$PATH" FAKE_CODEX_MODE=happy
          export HOME="$tmp/home" REPOSUITE_HOME="$tmp/rs"
          mkdir -p "$HOME" "$REPOSUITE_HOME"
          cd "$HOME"
          "$tmp/reposuite-relay" serve codex --key smoke | grep -q "runtimeState=cold"
          "$tmp/reposuite-relay" prompt smoke --text "ci smoke" | grep -q "native_thread_id=th_"
          "$tmp/reposuite-relay" status smoke | grep -q "harness=codex"
          "$tmp/reposuite-relay" config smoke --model ci-model | grep -q "harness=codex"
          "$tmp/reposuite-relay" stop smoke | grep -q "stopped key=smoke"
          "$tmp/reposuite-relay" daemon stop | grep -q "daemon stopped"
